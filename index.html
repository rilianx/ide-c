<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDE C · Estructuras de Datos</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="css/ide.css?v=202611181234">
<script src="vendor/codemirror/codemirror.js"></script>
<script src="vendor/codemirror/clike.js"></script>
<script src="vendor/codemirror/matchbrackets.js"></script>
<script src="vendor/codemirror/closebrackets.js"></script>
<script src="vendor/codemirror/active-line.js"></script>
<script>
  // Si algo no carga o falla al iniciar, se dice en la barra de estado (en vez de dejar la pantalla vacía).
  function errorInicio(texto) {
    const e = document.getElementById('estado');
    if (e) { e.textContent = 'Error: ' + texto + ' (recarga la página; si sigue, avísale al profesor)'; e.style.color = '#b42318'; }
  }
  addEventListener('error', e => errorInicio(e.message || 'no se pudo cargar ' + (e.target && (e.target.src || e.target.href) || 'un archivo')), true);
  addEventListener('unhandledrejection', e => errorInicio(String(e.reason && e.reason.message || e.reason)));
</script>
<script type="module" src="js/main.js?v=202611181234"></script>
</head>
<body>
<header>
  <h1>IDE C <span>· Estructuras de Datos</span></h1>
  <select id="ejercicio" aria-label="Ejercicio"></select>
  <span id="estado" class="estado">Cargando el compilador…</span>
</header>

<nav class="vistas" role="tablist">
  <button class="vista activa" data-vista="codigo" role="tab">Código</button>
  <button class="vista" data-vista="visual" role="tab" disabled title="Próximamente">Visualización (pronto)</button>
</nav>

<main id="codigo">
  <aside class="pasos" id="col-pasos">
    <h2 id="titulo-ejercicio"></h2>
    <p id="descripcion" class="descripcion"></p>
    <ol id="lista-pasos"></ol>
    <section id="enunciado" class="enunciado"></section>
    <h3>Funciones</h3>
    <ul id="funciones" class="funciones"></ul>
    <button id="restaurar" class="secundario">⟲ Restaurar archivos</button>
  </aside>
  <div class="divisor" data-col="izq" title="Arrastra para cambiar el ancho (doble clic: ocultar/mostrar)"></div>

  <section class="centro">
    <div class="barra-editor">
      <div id="pestanas" class="pestanas"></div>
      <div class="ajustes">
        <button id="letra-menos" title="Letra más chica">A−</button>
        <button id="letra-mas" title="Letra más grande">A+</button>
        <button id="ajustar" title="Ajustar líneas largas al ancho (wrap)">↩</button>
      </div>
    </div>
    <div id="editor" class="editor"></div>
    <div id="asistente" class="asistente"></div>
  </section>
  <div class="divisor" data-col="der" title="Arrastra para cambiar el ancho (doble clic: ocultar/mostrar)"></div>

  <section class="panel" id="col-tests">
    <div class="titulo-panel">
      <span>Tests <span id="resumen-tests"></span></span>
      <div class="acciones">
        <button id="probar-paso" class="principal" title="Correr los tests del paso elegido (Ctrl+Enter)">▶ Probar paso</button>
        <button id="probar-todo" title="Correr los tests de todos los pasos (Ctrl+Shift+Enter)">▶▶ Todos</button>
        <button id="detener" hidden title="Detener la ejecución">■ Detener</button>
        <button id="copiar-reporte" class="secundario" title="Copia tu código y los resultados, para pedir ayuda" hidden>📋 Copiar reporte</button>
      </div>
    </div>
    <div id="panel-tests" class="panel-cuerpo">
      <div id="compilacion-tests"></div>
      <div id="resultados"><p class="nota">▶ Probar paso compila list.c y corre los tests del paso elegido. Cada test usa solo la interfaz (list.h) y compara lo que imprime con lo esperado.</p></div>
    </div>
  </section>
</main>

<main id="visual" hidden>
  <p class="pronto">La visualización de la memoria llegará pronto.</p>
</main>
</body>
</html>
